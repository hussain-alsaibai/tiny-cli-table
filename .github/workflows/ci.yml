name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests
        run: python -m pytest test_tiny_table.py -v

  test-python37:
    # setup-python has no 3.7 build for ubuntu-24.04, and the
    # ubuntu-20.04 runner images that did have one are retired. The
    # official python:3.7 image is still published, so the 3.7 job runs
    # inside that container instead.
    runs-on: ubuntu-latest
    container: python:3.7
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install pytest
      - name: Unit tests
        run: python -m pytest test_tiny_table.py -v
